<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsFlow — Acceso</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9; --border: #e2e8f0;
    --text: #0f172a; --text2: #475569; --text3: #5b6b82;
    --wa: #15803d; --wa-strong: #166534; --wa-light: #dcfce7; --accent: #4f46e5;
    --red: #b91c1c; --red-light: #fee2e2;
    --radius: 14px; --shadow-lg: 0 24px 60px rgba(15, 23, 42, .14);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --surface: #121c2e; --surface2: #1a2740; --border: #27354f;
      --text: #f1f5f9; --text2: #cbd5e1; --text3: #94a3b8;
      --wa: #4ade80; --wa-strong: #86efac; --wa-light: #123524; --accent: #a5b4fc;
      --red: #fca5a5; --red-light: #3b1212; --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; position: relative; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; animation: float 14s ease-in-out infinite; }
  .blob.b1 { width: 420px; height: 420px; background: #4ade80; top: -140px; left: -100px; opacity: .26; }
  .blob.b2 { width: 360px; height: 360px; background: #818cf8; bottom: -120px; right: -90px; opacity: .22; animation-delay: -6s; }
  @keyframes float { 50% { transform: translate(30px, 24px) scale(1.08); } }

  .wrap { position: relative; width: 100%; max-width: 400px; animation: rise .7s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; font-size: .85rem; color: var(--text3); text-decoration: none; padding: 4px 8px 4px 2px; border-radius: 8px; transition: color .2s, transform .2s var(--ease); }
  .back:hover { color: var(--text); transform: translateX(-3px); }
  .back svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .card { background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 22px; padding: 32px 28px 26px; box-shadow: var(--shadow-lg); }
  .head { text-align: center; margin-bottom: 24px; }
  .logo { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 15px; background: var(--wa); display: grid; place-items: center; box-shadow: 0 10px 24px rgba(34, 197, 94, .35); transition: transform .4s var(--ease); }
  .card:hover .logo { transform: rotate(-6deg) scale(1.05); }
  .logo svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0 0 6px; font-size: 1.65rem; letter-spacing: -.02em; line-height: 1.2; background: linear-gradient(100deg, var(--wa-strong), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { margin: 0; color: var(--text2); font-size: .95rem; }

  .error-msg { display: none; margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: var(--red-light); color: var(--red); font-size: .88rem; font-weight: 600; }
  .error-msg.show { display: block; animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .field { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text3); }
  .input-wrap { position: relative; }
  input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font: inherit; transition: border-color .2s, box-shadow .2s, background .2s; }
  input::placeholder { color: var(--text3); opacity: .8; }
  input:hover { border-color: var(--text3); }
  input:focus { outline: none; border-color: var(--wa); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--wa) 18%, transparent); }
  .input-wrap input { padding-right: 48px; }
  .toggle-pw { position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--text3); cursor: pointer; display: grid; place-items: center; transition: background .2s, color .2s; }
  .toggle-pw:hover { background: var(--border); color: var(--text); }
  .toggle-pw svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .btn-login { position: relative; overflow: hidden; width: 100%; height: 50px; margin-top: 6px; border: 0; border-radius: 12px; background: var(--wa-strong); color: #fff; font: inherit; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 22px rgba(22, 101, 52, .3); transition: transform .2s var(--ease), box-shadow .2s, filter .2s; }
  @media (prefers-color-scheme: dark) { .btn-login { background: var(--wa); color: #06260f; box-shadow: 0 8px 22px rgba(74, 222, 128, .22); } }
  .btn-login:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.07); }
  .btn-login:active:not(:disabled) { transform: translateY(0) scale(.98); }
  .btn-login:disabled { opacity: .75; cursor: progress; }
  .btn-login svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s var(--ease); }
  .btn-login:hover:not(:disabled) svg { transform: translateX(4px); }
  .spin { display: none; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  .loading .spin { display: block; } .loading .arrow { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer-note { margin: 22px 0 0; text-align: center; font-size: .8rem; color: var(--text3); }
  .footer-note a { color: var(--text2); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div><div class="blob b2" aria-hidden="true"></div>

<main class="wrap">
  <a class="back" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Volver al inicio</a>

  <form class="card" id="login-form" novalidate>
    <div class="head">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <h1 id="app-title" data-brand>WhatsFlow</h1>
      <p class="subtitle">Ingresá al panel de atención</p>
    </div>

    <div class="error-msg" id="error-box" role="alert" aria-live="assertive"></div>

    <div class="field">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" placeholder="tu.usuario" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Mostrar contraseña" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-login" id="btn-login" type="submit">
      <span class="spin" aria-hidden="true"></span>
      <span id="btn-text">Ingresar</span>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <p class="footer-note"><span data-brand>WhatsFlow</span> · Panel de atención</p>
  </form>
</main>

<script>
  // Si ya hay sesión, ir directo al panel
  fetch('/api/auth/me').then(r => { if (r.ok) r.json().then(d => { if (d && !d.error) location.href = '/'; }); }).catch(() => {});

  const $ = (id) => document.getElementById(id);
  const form = $('login-form'), btn = $('btn-login'), errBox = $('error-box');

  $('toggle-pw').addEventListener('click', () => {
    const pw = $('password'), show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    $('toggle-pw').setAttribute('aria-pressed', show);
    $('toggle-pw').setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  function fail(msg) {
    errBox.textContent = msg; errBox.classList.remove('show'); void errBox.offsetWidth; errBox.classList.add('show');
    btn.disabled = false; btn.classList.remove('loading'); btn.removeAttribute('aria-busy'); $('btn-text').textContent = 'Ingresar';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = $('username').value.trim(), password = $('password').value;
    if (!username || !password) return fail('Completá usuario y contraseña');

    btn.disabled = true; btn.classList.add('loading'); btn.setAttribute('aria-busy', 'true');
    $('btn-text').textContent = 'Ingresando…';
    errBox.classList.remove('show');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }), credentials: 'include',
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) { location.href = '/'; return; }
      fail(data.error || 'Error al ingresar');
      $('password').select();
    } catch { fail('Error de conexión. Probá de nuevo.'); }
  });
</script>
<script>
  // Marca blanca: reemplaza "WhatsFlow" por APP_NAME de esta instalación
  fetch('/api/brand').then(r => r.json()).then(b => {
    if (!b.name) return;
    document.querySelectorAll('[data-brand]').forEach(e => e.textContent = b.name);
    document.title = document.title.replace('WhatsFlow', b.name);
  }).catch(() => {});
</script>
</body>
</html>
